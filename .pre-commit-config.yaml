repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: claude-plugin-validate
        name: claude plugin validate (strict)
        entry: scripts/validate-plugins.sh
        language: script
        pass_filenames: false
        files: '^(\.claude-plugin/|plugins/)'
