# This file configures markdownlint for plugin component files, which are
# written in Markdown but have some non-standard conventions (e.g. HTML-like
# prompt tags, frontmatter, etc.). The goal of these settings is to a) catch
# syntax errors and b) enforce a style that is optimal for LLM consumption,
# while reducing formatting churn on docs that are edited by or generated by
# agents. Some rules are relaxed and others are pinned to a canonical style.

# Start from the recommended ruleset
default: true

# Pin unordered list style to dashes so the linter auto-normalizes them to be
# stable across revisions. Dashes are considered slightly safer for this.
MD004:
  style: dash

# Don't require line length limits (a human-readability concern)
MD013: false

# Don't require blank lines around headings (human-readability concern)
MD022: false

# Allow multiple sections to use the same subheading text (e.g. "Examples" or
# "Usage")
MD024:
  siblings_only: true

# Ordered list items must increment (i.e. 1. 2. 3.). This ensures that
# sequential ordering is explicit (1. 1. 1. is not valid), so that lists can be
# parsed as plain text and re-ordering never unintentionally causes items to be
# interpreted out of sequence (1. 3. 2. is not valid).
MD029:
  style: ordered

# Don't require blank lines around fenced code blocks (human-readability
# concern)
MD031: false

# Don't require blank lines around lists (human-readability concern)
MD032: false

# Disable naive detection of HTML tags. Skill/agent docs use prompt tags
# (<example>, <commentary>, etc.) that are not HTML but would be flagged by this.
MD033: false

# Allow bold-only lines as pseudo-headings. Prompt docs use short bold labels
# (**Overview**, **Key points**, ...) as lightweight section cues rather than
# real headings. (Run-in labels like "**Why:** ..." don't trigger this rule
# anyway — the trailing colon marks them as prose.)
MD036: false

# Allow fenced code blocks with no language specifier. Prompt docs often fence
# plain text examples, and agents don't need a language specifier to parse them.
MD040: false

# Don't require H1 on first line. Skill/agent/command docs start with
# frontmatter + prose, not a title.
MD041: false

# Pin emphasis/strong styles to asterisks for the same reason. Asterisks are
# considered slightly safer for this.
MD049:
  style: asterisk
MD050:
  style: asterisk

# Don't require blank lines around tables (human-readability concern). Skill
# docs use "red flag" tables that read fine without surrounding blanks.
MD058: false

# ---- Consider ----

# Allow bare URLs (e.g. without <url> or [text](url))
# MD034: false

# Allow non-"descriptive" link text ("here", "click here", "more", "link").
# READMEs and agent docs use these freely; enforcing descriptive text could
# cause churn.
# MD059: false

# Allow up to two consecutive blank lines (agents leave a double blank between
# sections); only flag three or more.
# MD012:
#   maximum: 2

# Set nested-list indent width. Default is 2; set 4 if agents consistently
# produce 4-space nesting and matching is preferable to rewriting.
# MD007:
#   indent: 2

# Enforce proper-noun casing (an opt-in quality gate, not a relaxation). Needs a
# names list; normalizes e.g. "github"/"Javascript" -> "GitHub"/"JavaScript".
# MD044:
#   names: [GitHub, JavaScript, TypeScript, Markdown, Claude Code]

# ---- Pin remaining styles for cross-revision stability ----

# Pin heading style to ATX ("#"), never setext ("===" / "---" underlines).
MD003:
  style: atx

# Pin code fence character to backticks, never tildes.
MD048:
  style: backtick

# Pin thematic-break (horizontal rule) style to match the "---" frontmatter
# delimiter. Must be set with MD003 style atx to avoid setext headings.
MD035:
  style: "---"

# Pin code blocks to fenced (``` ... ```), never indented. Fenced blocks are
# unambiguous and carry a language hint; an indented block is easy to introduce
# by accident — a stray 4-space indent silently turns prose into a code block.
MD046:
  style: fenced

# Pin table cells to use leading and trailing pipes (| a | b |), the
# GFM-standard form, so mixed pipe styles don't flip based on whichever table
# comes first.
MD055:
  style: leading_and_trailing
