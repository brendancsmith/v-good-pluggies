name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (markdown + manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  release-dry-run:
    name: Release dry run
    # Prove the release-please config parses and computes releases before it
    # lands on main and drives the real Release workflow. Reads the config
    # from the PR branch over the API (no checkout), so fork PRs — whose
    # branches don't exist in this repo — are skipped.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: release-please release-pr --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes release-please@17 release-pr --dry-run
          --repo-url=${{ github.repository }}
          --target-branch=${{ github.head_ref }}
          --token="$GITHUB_TOKEN"

  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate marketplace manifest
        run: claude plugin validate .
      - name: Validate each plugin (strict)
        run: |
          shopt -s nullglob
          found=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            found=1
            dir="$(dirname "$(dirname "$manifest")")"
            echo "::group::validate ${dir}"
            claude plugin validate "${dir}" --strict
            echo "::endgroup::"
          done
          if [ "${found}" -eq 0 ]; then
            echo "No plugins defined yet - marketplace-only validation."
          fi
